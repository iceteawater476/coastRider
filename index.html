<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Coast Ride</title>
<style>
:root{--g:rgba(16,26,42,.58);--t:#f4f7fb;--a:#7fd6c2;--b:rgba(255,255,255,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g:rgba(8,14,26,.66)}}
:root[data-theme="dark"]{--g:rgba(8,14,26,.66)}
html,body{height:100%;margin:0;background:#9cc9e8;overflow:hidden;font:14px system-ui,-apple-system,sans-serif;color:var(--t);user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;display:block;touch-action:none}
.glass{background:var(--g);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--b);border-radius:16px}
button,input{font:inherit;color:inherit}
button{background:var(--b);border:1px solid transparent;border-radius:10px;padding:7px 11px;cursor:pointer}
button.on{background:var(--a);color:#06231d;font-weight:600}
input[type=text]{background:rgba(255,255,255,.12);border:1px solid var(--b);border-radius:10px;padding:7px 10px;min-width:0;flex:1}
input[type=range]{width:90px;accent-color:var(--a)}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
#card{max-width:560px;width:100%;padding:22px;text-align:center}
h1{margin:0 0 4px;font-weight:600;letter-spacing:.04em}
p{margin:0 0 14px;opacity:.8}
#bikes{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:14px}
#bikes button{padding:12px 6px;font-size:13px}#bikes b{display:block;font-size:26px;margin-bottom:4px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
#panel{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(780px,calc(100% - 20px));padding:6px 12px 12px;z-index:3}
#sp{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;padding:8px 14px;z-index:3;font-variant-numeric:tabular-nums}
#tg{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;z-index:4}
#hint{opacity:.7;font-size:12px;margin-top:8px}
#tc{display:none;position:fixed;left:0;right:0;bottom:200px;justify-content:space-between;padding:0 14px;z-index:3;pointer-events:none}
#tc div{display:flex;gap:10px;pointer-events:auto}#tc button{width:58px;height:58px;font-size:22px;background:var(--g)}
@media (pointer:coarse){#tc{display:flex}}
.hid{display:none!important}
</style></head><body>
<div id="start"><div id="card" class="glass"><h1>COAST RIDE</h1><p>Slow roads. Ocean air. Nowhere to be.</p>
<div id="bikes"></div>
<div class="row"><input type="text" id="rl0" placeholder="Radio Garden link (optional) — radio.garden/listen/…"></div>
<div class="row" style="justify-content:center;margin-top:14px"><button id="go" class="on" style="padding:10px 28px;font-size:16px">Start riding</button></div>
<div id="hint">WASD / arrows to ride · P autopilot · drag to look around</div></div></div>
<button id="tg" class="glass hid">☰</button>
<div id="sp" class="glass hid"></div>
<div id="tc"><div><button id="bl" class="glass">◀</button><button id="br" class="glass">▶</button></div><div><button id="bu" class="glass">▲</button><button id="bd" class="glass">▼</button></div></div>
<div id="panel" class="glass hid">
<div class="row" id="wx"></div>
<div class="row"><button id="bk"></button><button id="ap"></button><input type="text" id="rl" placeholder="Radio Garden link…"><button id="rb">▶ Radio</button></div>
<div class="row" style="font-size:12px"><span id="rs" style="opacity:.8;flex:1">Radio: paste a radio.garden station link</span>Radio <input type="range" id="rv" min="0" max="1" step=".05" value=".8"> Ocean/rain <input type="range" id="av" min="0" max="1" step=".05" value=".6"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),V=(x,y,z)=>new THREE.Vector3(x,y,z),C=h=>new THREE.Color(h);
const sv=(k,v)=>{try{localStorage.setItem('cr_'+k,v)}catch(e){}},ld=k=>{try{return localStorage.getItem('cr_'+k)}catch(e){return null}};
const M=(c,o)=>new THREE.MeshLambertMaterial(Object.assign({color:c,flatShading:true},o));
const sm=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
const hs=(x,z)=>{const s=Math.sin(x*127.1+z*311.7)*43758.5453;return s-Math.floor(s)};
function vn(x,z){const i=Math.floor(x),j=Math.floor(z),fx=x-i,fz=z-j,u=fx*fx*(3-2*fx),v=fz*fz*(3-2*fz);return(hs(i,j)*(1-u)+hs(i+1,j)*u)*(1-v)+(hs(i,j+1)*(1-u)+hs(i+1,j+1)*u)*v}
const fbm=(x,z)=>vn(x,z)*.55+vn(x*2.1,z*2.1)*.3+vn(x*4.3,z*4.3)*.15;
const CX=z=>Math.sin(z*.011)*34+Math.sin(z*.027+1)*11,DCX=z=>Math.cos(z*.011)*.374+Math.cos(z*.027+1)*.297;
const RZ=z=>.8+Math.sin(z*.006)*1.6+Math.sin(z*.017)*.6,DRZ=z=>Math.cos(z*.006)*.0096+Math.cos(z*.017)*.0102;
function H(x,z){const u=x-CX(z),r=RZ(z)-.12;if(u>0){const t=sm(6,34,u);return r*(1-t)-4*t+vn(x*.1,z*.1)*.5*t}const t=sm(7,60,-u);return r*(1-t)+t*(RZ(z)+18*fbm(x*.012,z*.012)+3+vn(x*.06,z*.06)*2)}

/* renderer */
const ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(ren.domElement);
const scn=new THREE.Scene();scn.fog=new THREE.FogExp2(0xcfe6f3,.008);
const cam=new THREE.PerspectiveCamera(58,1,.1,1500);
const rsz=()=>{ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()};addEventListener('resize',rsz);rsz();
const hemi=new THREE.HemisphereLight(0xffffff,0x56624a,.7),sunL=new THREE.DirectionalLight(0xffffff,1),lamp=new THREE.PointLight(0xffe6b0,0,26);
scn.add(hemi,sunL,sunL.target);
const skyM=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,uniforms:{t:{value:C(0)},h:{value:C(0)}},
vertexShader:'varying float y;void main(){y=normalize(position).y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
fragmentShader:'uniform vec3 t,h;varying float y;void main(){gl_FragColor=vec4(mix(h,t,smoothstep(0.,.55,y)),1.);}'});
const sky=new THREE.Mesh(new THREE.SphereGeometry(900,16,12),skyM);sky.renderOrder=-1;sky.frustumCulled=false;scn.add(sky);
const disc=new THREE.Mesh(new THREE.SphereGeometry(26,16,12),new THREE.MeshBasicMaterial({fog:false,transparent:true}));scn.add(disc);

/* weather */
const W={
sun:{l:'☀️ Sunny',top:C(0x3f8fdc),hor:C(0xcfe6f3),sc:C(0xfff0c4),oc:C(0x2a95c8),cl:C(0xffffff),sd:V(.35,.5,-.8),fog:.008,amb:.7,sun:1,rain:0,A:.3,nt:0,co:.9},
cloud:{l:'⛅ Cloudy',top:C(0x6f8ba3),hor:C(0xbfc9d1),sc:C(0xffffff),oc:C(0x4a8aad),cl:C(0xe4e8ec),sd:V(.3,.6,-.7),fog:.009,amb:.8,sun:.45,rain:0,A:.45,nt:0,co:.95},
rain:{l:'🌧️ Rain',top:C(0x3e4b58),hor:C(0x77838d),sc:C(0xaab4bd),oc:C(0x3b6685),cl:C(0x59636d),sd:V(.3,.6,-.7),fog:.013,amb:.62,sun:.1,rain:1,A:.65,nt:.25,co:1},
fog:{l:'🌫️ Fog',top:C(0xaab6bd),hor:C(0xc8d0d4),sc:C(0xffffff),oc:C(0x6f9fb5),cl:C(0xc8d0d4),sd:V(.3,.6,-.7),fog:.026,amb:.85,sun:.2,rain:0,A:.25,nt:.1,co:.5},
sunset:{l:'🌅 Sunset',top:C(0x3a3e82),hor:C(0xff9a68),sc:C(0xff9f55),oc:C(0x3a6a8f),cl:C(0xffb48e),sd:V(.15,.1,-.95),fog:.009,amb:.5,sun:.9,rain:0,A:.35,nt:.35,co:.85},
night:{l:'🌙 Night',top:C(0x04071a),hor:C(0x1a2448),sc:C(0xb9ccff),oc:C(0x12294f),cl:C(0x2d3760),sd:V(-.35,.45,-.8),fog:.01,amb:.32,sun:.4,rain:0,A:.35,nt:1,co:.8}};
const cur={top:C(0x3f8fdc),hor:C(0xcfe6f3),sc:C(0xfff0c4),oc:C(0x2a95c8),cl:C(0xffffff),sd:V(.35,.5,-.8),fog:.008,amb:.7,sun:1,rain:0,A:.3,nt:0,co:.9};
let wk=ld('wx')in W?ld('wx'):'sun';
function lerpW(dt){const T=W[wk],k=1-Math.exp(-dt*1.3);['top','hor','sc','oc','cl'].forEach(n=>cur[n].lerp(T[n],k));['fog','amb','sun','rain','A','nt','co'].forEach(n=>cur[n]+=(T[n]-cur[n])*k);cur.sd.lerp(T.sd,k)}
function setW(k){wk=k;sv('wx',k);[...$('wx').children].forEach(b=>b.classList.toggle('on',b.dataset.k===k))}
for(const k in W){const b=document.createElement('button');b.textContent=W[k].l;b.dataset.k=k;b.onclick=()=>setW(k);$('wx').appendChild(b)}

/* terrain */
const NX=88,NZ=104,CS=2.5,ZO=81,GR=C(0x808085),GV=C(0x756e60),WH=C(0xf4f8fa);
const tg=new THREE.PlaneGeometry(1,1,NX,NZ);tg.rotateX(-Math.PI/2);tg.setAttribute('color',new THREE.BufferAttribute(new Float32Array((NX+1)*(NZ+1)*3),3));
const terr=new THREE.Mesh(tg,new THREE.MeshLambertMaterial({vertexColors:true,flatShading:true}));terr.frustumCulled=false;scn.add(terr);
function tint(x,z,h,u,c){const n=vn(x*.07,z*.07);
 if(u>0){if(h<-1.5)c.setRGB(.45,.62,.6);else c.setRGB(.9-.06*n,.82-.06*n,.62)}
 else{const t=sm(10,50,-u);c.setRGB(.3+.1*n-.08*t,.52+.1*n-.12*t,.26);if(h>13)c.lerp(GR,sm(13,19,h))}
 if(u>0&&h<-1.1&&h>-1.9&&hs(x*3.1,z*3.7)>.3)c.lerp(WH,.75);else if(u<-8&&hs(x*5.3,z*4.1)>.95)c.setRGB(.95,.85,.35);
 if(Math.abs(u)<6.5)c.lerp(GV,.7)}
let tgx=1e9,tgz=1e9;
function upTerrain(px,pz){const gx=Math.round(px/5)*5,gz=Math.round(pz/5)*5;if(gx===tgx&&gz===tgz)return;tgx=gx;tgz=gz;
 const p=tg.attributes.position,c=tg.attributes.color,col=C(0);let n=0;
 for(let j=0;j<=NZ;j++)for(let i=0;i<=NX;i++,n++){const x=gx+(i-NX/2)*CS,z=gz+(j-ZO)*CS,h=H(x,z);p.setXYZ(n,x,h,z);tint(x,z,h,x-CX(z),col);c.setXYZ(n,col.r,col.g,col.b)}
 p.needsUpdate=c.needsUpdate=true}

/* ocean */
const og=new THREE.PlaneGeometry(480,480,60,60);og.rotateX(-Math.PI/2);
const om=new THREE.MeshPhongMaterial({color:0x2a95c8,flatShading:true,shininess:90,specular:0x778899,transparent:true,opacity:.88}),ocean=new THREE.Mesh(og,om),op=og.attributes.position;ocean.frustumCulled=false;scn.add(ocean);
function upOcean(px,pz,t){const ox=Math.round(px/8)*8,oz=Math.round(pz/8)*8,A=cur.A;ocean.position.set(ox,-1.8,oz);
 for(let i=0;i<op.count;i++){const x=op.getX(i)+ox,z=op.getZ(i)+oz;op.setY(i,Math.sin(x*.07+t*1.1)*A+Math.sin(z*.1+x*.04+t*.8)*A*.8)}op.needsUpdate=true}

/* road */
const RR=150,rpos=new Float32Array(RR*6),rgm=new THREE.BufferGeometry();rgm.setAttribute('position',new THREE.BufferAttribute(rpos,3));
{const ix=[];for(let i=0;i<RR-1;i++){const a=i*2;ix.push(a,a+1,a+2,a+1,a+3,a+2)}rgm.setIndex(ix)}
const road=new THREE.Mesh(rgm,M(0x3b3e45));road.frustumCulled=false;scn.add(road);
const dg=new THREE.PlaneGeometry(.25,2.4).rotateX(-Math.PI/2),dmat=new THREE.MeshBasicMaterial({color:0xeeeedd}),dashes=[];
for(let i=0;i<44;i++){const d=new THREE.Mesh(dg,dmat);d.frustumCulled=false;scn.add(d);dashes.push(d)}
function upRoad(pz){const z0=Math.floor(pz/2)*2+30;for(let i=0;i<RR;i++){const z=z0-i*2,c=CX(z),y=RZ(z)+.03,o=i*6;rpos[o]=c-4.3;rpos[o+1]=y;rpos[o+2]=z;rpos[o+3]=c+4.3;rpos[o+4]=y;rpos[o+5]=z}rgm.attributes.position.needsUpdate=true;
 const zb=Math.ceil((pz+20)/5)*5;dashes.forEach((d,i)=>{const z=zb-i*5;d.position.set(CX(z),RZ(z)+.05,z);d.rotation.y=Math.atan(DCX(z))})}

/* trees */
const MX=420,dm=new THREE.Object3D(),tc=C(0);
const trunk=new THREE.InstancedMesh(new THREE.CylinderGeometry(.6,.9,1,5).translate(0,.5,0),M(0x6b4a2f),MX),
ball=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1,0),M(0xffffff),MX),
cone=new THREE.InstancedMesh(new THREE.ConeGeometry(1,3,6).translate(0,1.5,0),M(0xffffff),MX);
const rail=new THREE.InstancedMesh(new THREE.BoxGeometry(.06,.07,10.2),M(0xd8dadd),60);
[trunk,ball,cone,rail].forEach(m=>{m.frustumCulled=false;m.count=0;scn.add(m)});
const put=(m,n,x,y,z,sx,sy,sz,c)=>{dm.position.set(x,y,z);dm.scale.set(sx,sy,sz);dm.updateMatrix();m.setMatrixAt(n,dm.matrix);if(c)m.setColorAt(n,c)};
let tkc=1e9;
function upTrees(pz){const kc=Math.floor(pz/10);if(kc===tkc)return;tkc=kc;let a=0,b=0,c2=0;
 for(let k=kc-24;k<=kc+4;k++)for(let i=0;i<7;i++){const r1=hs(k,i),r2=hs(i+.5,k),r3=hs(k+.3,i+.7),r4=hs(k*1.7,i*2.3),z=k*10+r1*10;let u,t;
  if(i<5){u=-(9+r2*r2*75);t=r3<.45?0:1}else{if(r3<.5)continue;u=7+r2*9;t=2}
  const x=CX(z)+u,y=H(x,z),s=.8+r4*.9;if(y>15||(t==2&&y<-1))continue;
  if(t==0){put(trunk,a++,x,y,z,.35*s,2.4*s,.35*s);put(ball,b++,x,y+2.6*s,z,1.5*s,1.3*s,1.5*s,tc.setRGB(.2+r2*.15,.45+r4*.15,.2))}
  else if(t==1){put(trunk,a++,x,y,z,.3*s,1.2*s,.3*s);put(cone,c2++,x,y+s,z,1.4*s,2.2*s,1.4*s,tc.setRGB(.1,.3+r2*.1,.2))}
  else{put(trunk,a++,x,y,z,.22*s,5*s,.22*s);put(ball,b++,x,y+5*s,z,2.4*s,.45*s,2.4*s,tc.setRGB(.25,.55,.25))}}
 let rc=0;for(let k=kc-24;k<=kc+4;k++){const z=k*10,cx=CX(z),ry=RZ(z),q1=hs(k,9.1),q2=hs(k,3.3),q3=hs(k,7.7);
  dm.rotation.set(0,Math.atan(DCX(z)),0);put(rail,rc++,cx+4.9,ry+.65,z,1,1,1);dm.rotation.set(0,0,0);put(trunk,a++,cx+4.9,ry,z,.1,.9,.1);
  if(k%3==0){put(trunk,a++,cx-5.4,ry,z,.12,5.2,.12);put(ball,b++,cx-5,ry+5.2,z,.45,.12,.28,tc.setRGB(1,.95,.7))}
  for(let j=0;j<2;j++){const r=hs(k+j*.37,2.2),x=cx-(6.5+r*12),zz=z+r*9;put(ball,b++,x,H(x,zz)+.1,zz,.9+r,.6+r*.4,.9+r,tc.setRGB(.15+r*.1,.36+r*.12,.17))}
  if(q2>.5){const x=q3<.5?cx+7+q1*5:cx-8-q1*30,y=H(x,z);if(y>-1.3)put(ball,b++,x,y+.1,z+q1*8,.8+q1,.5+q1*.4,.7+q1,tc.setRGB(.5,.5,.52))}
  if(q3>.8){const x=cx+8+q2*4,y=H(x,z);if(y>-1.1){put(trunk,a++,x,y,z,.05,2.2,.05);put(cone,c2++,x,y+2.1,z,1.3,.35,1.3,tc.setRGB(q1>.5?.9:.2,q2>.5?.85:.4,q1>.5?.3:.8))}}}
 rail.count=rc;
 trunk.count=a;ball.count=b;cone.count=c2;[trunk,ball,cone,rail].forEach(m=>{m.instanceMatrix.needsUpdate=true;if(m.instanceColor)m.instanceColor.needsUpdate=true})}

/* clouds + rain */
const cm=new THREE.MeshBasicMaterial({fog:false,transparent:true}),cg=new THREE.IcosahedronGeometry(1,1),clouds=[];
for(let i=0;i<16;i++){const g=new THREE.Group();for(let j=0;j<5;j++){const m=new THREE.Mesh(cg,cm);m.position.set((j-2)*10+Math.random()*6,Math.random()*3,Math.random()*8);m.scale.set(9+Math.random()*7,4+Math.random()*3,7+Math.random()*4);g.add(m)}
 g.position.set(Math.random()*600-300,70+Math.random()*40,-Math.random()*520+60);scn.add(g);clouds.push(g)}
const boats=[],birds=[],mtn=new THREE.Group(),mtm=new THREE.MeshBasicMaterial({fog:false});
for(let i=0;i<5;i++){const g=new THREE.Group(),h=new THREE.Mesh(new THREE.BoxGeometry(.9,.4,2.6),M(0xf2f2ee)),s=new THREE.Mesh(new THREE.ConeGeometry(.9,3.4,3),M(i%2?0xf6e7c8:0xffffff));s.position.set(0,2.1,-.2);s.scale.z=.12;g.add(h,s);g.userData={u:55+Math.random()*90};g.position.z=-i*60;scn.add(g);boats.push(g)}
for(let i=0;i<8;i++){const g=new THREE.Group(),w1=new THREE.Mesh(new THREE.BoxGeometry(.9,.03,.22),M(0xffffff)),w2=w1.clone();w1.position.x=-.45;w2.position.x=.45;g.add(w1,w2);g.userData={w:[w1,w2],p:Math.random()*6.28,r:14+Math.random()*30,h:8+Math.random()*10,s:.25+Math.random()*.2};scn.add(g);birds.push(g)}
for(let i=0;i<14;i++){const a=i/14*6.283+Math.random()*.3,r=520+Math.random()*100,hh=30+Math.random()*80,m=new THREE.Mesh(new THREE.ConeGeometry(50+Math.random()*60,hh*1.6,5),mtm);m.position.set(Math.cos(a)*r,hh*.8-30,Math.sin(a)*r);mtn.add(m)}scn.add(mtn);
function upLife(dt,px,pz){boats.forEach((g,i)=>{if(g.position.z>pz+40){g.position.z-=320;g.userData.u=55+Math.random()*90}const z=g.position.z;g.position.set(CX(z)+g.userData.u,-1.65+Math.sin(T*.9+i)*.12,z);g.rotation.z=Math.sin(T*.7+i)*.06;g.rotation.y=Math.atan(DCX(z))+Math.PI});
 const cz=pz-35;birds.forEach(g=>{const d=g.userData;d.p+=dt*d.s;g.position.set(CX(cz)+28+Math.cos(d.p)*d.r,RZ(cz)+d.h+Math.sin(d.p*3)*1.5,cz+Math.sin(d.p)*d.r*1.6);g.rotation.y=Math.atan2(Math.sin(d.p),-1.6*Math.cos(d.p));const f=Math.sin(T*7+d.r)*.6;d.w[0].rotation.z=f;d.w[1].rotation.z=-f});
 mtn.position.set(cam.position.x,0,cam.position.z);mtm.color.copy(cur.hor).lerp(cur.top,.3).multiplyScalar(.75)}
const RN=800,rp=new Float32Array(RN*3),rpos2=new Float32Array(RN*6),rgeo=new THREE.BufferGeometry();
for(let i=0;i<RN;i++){rp[i*3]=Math.random()*40-20;rp[i*3+1]=Math.random()*30;rp[i*3+2]=Math.random()*40-20}
rgeo.setAttribute('position',new THREE.BufferAttribute(rpos2,3));
const rain=new THREE.LineSegments(rgeo,new THREE.LineBasicMaterial({color:0xcfe0ee,transparent:true,opacity:.4}));rain.frustumCulled=false;scn.add(rain);
function upSky(dt,px,pz){upLife(dt,px,pz);clouds.forEach(g=>{g.position.x+=dt*1.5;if(g.position.z>pz+120){g.position.z-=520;g.position.x=px+Math.random()*600-300}if(Math.abs(g.position.x-px)>330)g.position.x=px+(Math.random()-.5)*600});
 rain.visible=cur.rain>.03;if(!rain.visible)return;rain.material.opacity=.45*cur.rain;const c=cam.position;
 for(let i=0;i<RN;i++){let y=rp[i*3+1]-28*dt;if(y<0)y+=30;rp[i*3+1]=y;const x=c.x+rp[i*3],z=c.z+rp[i*3+2],Y=c.y-10+y,o=i*6;rpos2[o]=x;rpos2[o+1]=Y;rpos2[o+2]=z;rpos2[o+3]=x-.05;rpos2[o+4]=Y+.7;rpos2[o+5]=z}
 rgeo.attributes.position.needsUpdate=true}

/* bikes */
const BIKES=[
{n:'Beach Cruiser',e:'🚲',t:'b',c:0x38b2a3,v:7,R:.34,wb:1.04},
