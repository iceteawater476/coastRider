<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Coast Ride</title>
<style>
:root{--g:rgba(16,26,42,.58);--t:#f4f7fb;--a:#7fd6c2;--b:rgba(255,255,255,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g:rgba(8,14,26,.66)}}
:root[data-theme="dark"]{--g:rgba(8,14,26,.66)}
html,body{height:100%;margin:0;background:#9cc9e8;overflow:hidden;font:14px system-ui,-apple-system,sans-serif;color:var(--t);user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;display:block;touch-action:none}
#gr{position:fixed;inset:0;pointer-events:none;z-index:2;mix-blend-mode:soft-light;background:rgba(255,150,80,.9);opacity:0}
#vg{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at 50% 60%,rgba(0,0,0,0) 52%,rgba(28,14,38,.4) 100%)}
.glass{background:var(--g);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--b);border-radius:16px}
button,input{font:inherit;color:inherit}
button{background:var(--b);border:1px solid transparent;border-radius:10px;padding:7px 11px;cursor:pointer}
button.on{background:var(--a);color:#06231d;font-weight:600}
input[type=text]{background:rgba(255,255,255,.12);border:1px solid var(--b);border-radius:10px;padding:7px 10px;min-width:0;flex:1}
input[type=range]{width:90px;accent-color:var(--a)}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
#card{max-width:560px;width:100%;padding:22px;text-align:center}
h1{margin:0 0 4px;font-weight:600;letter-spacing:.04em}
p{margin:0 0 14px;opacity:.8}
#bikes{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:14px}
#bikes button{padding:12px 6px;font-size:13px}#bikes b{display:block;font-size:26px;margin-bottom:4px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
#panel{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(780px,calc(100% - 20px));padding:6px 12px 12px;z-index:3}
#sp{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;padding:8px 14px;z-index:3;font-variant-numeric:tabular-nums}
#tg{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;z-index:4}
#hint{opacity:.7;font-size:12px;margin-top:8px}
#tc{display:none;position:fixed;left:0;right:0;bottom:200px;justify-content:space-between;padding:0 14px;z-index:3;pointer-events:none}
#tc div{display:flex;gap:10px;pointer-events:auto}#tc button{width:58px;height:58px;font-size:22px;background:var(--g)}
@media (pointer:coarse){#tc{display:flex}}
.hid{display:none!important}
</style></head><body>
<div id="vg"></div><div id="gr"></div><div id="start"><div id="card" class="glass"><h1>COAST RIDE</h1><p>Slow roads. Ocean air. Nowhere to be.</p>
<div id="bikes"></div>
<div class="row"><input type="text" id="rl0" placeholder="Radio Garden link (optional) — radio.garden/listen/…"></div>
<div class="row" style="justify-content:center;margin-top:14px"><button id="go" class="on" style="padding:10px 28px;font-size:16px">Start riding</button></div>
<div id="hint">WASD / arrows to ride · P autopilot · drag to look around</div></div></div>
<button id="tg" class="glass hid">☰</button>
<div id="sp" class="glass hid"></div>
<div id="tc"><div><button id="bl" class="glass">◀</button><button id="br" class="glass">▶</button></div><div><button id="bu" class="glass">▲</button><button id="bd" class="glass">▼</button></div></div>
<div id="panel" class="glass hid">
<div class="row" id="wx"></div>
<div class="row"><button id="bk"></button><button id="ap"></button><button id="cr">🎯 Recenter cam</button><button id="aa">⏱ Auto-autopilot</button><input type="text" id="rl" placeholder="Radio Garden link…"><button id="rb">▶ Radio</button></div>
<div class="row" style="font-size:12px"><span id="rs" style="opacity:.8;flex:1">Radio: paste a radio.garden station link</span>Radio <input type="range" id="rv" min="0" max="1" step=".05" value=".8"> Ocean/rain <input type="range" id="av" min="0" max="1" step=".05" value=".6"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),V=(x,y,z)=>new THREE.Vector3(x,y,z),C=h=>new THREE.Color(h);
const sv=(k,v)=>{try{localStorage.setItem('cr_'+k,v)}catch(e){}},ld=k=>{try{return localStorage.getItem('cr_'+k)}catch(e){return null}};
const FF=s=>{s.fragmentShader=s.fragmentShader.replace('#include <fog_fragment>',`#ifdef USE_FOG
float ff=1.-exp(-fogDensity*fogDensity*fogDepth*fogDepth);ff=max(ff,smoothstep(220.,400.,fogDepth));gl_FragColor.rgb=mix(gl_FragColor.rgb,fogColor,ff);
#endif`)};
const M=(c,o)=>{const m=new THREE.MeshLambertMaterial(Object.assign({color:c,flatShading:true},o));m.onBeforeCompile=FF;return m};
const sm=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
const hs=(x,z)=>{const s=Math.sin(x*127.1+z*311.7)*43758.5453;return s-Math.floor(s)};
function vn(x,z){const i=Math.floor(x),j=Math.floor(z),fx=x-i,fz=z-j,u=fx*fx*(3-2*fx),v=fz*fz*(3-2*fz);return(hs(i,j)*(1-u)+hs(i+1,j)*u)*(1-v)+(hs(i,j+1)*(1-u)+hs(i+1,j+1)*u)*v}
const fbm=(x,z)=>vn(x,z)*.55+vn(x*2.1,z*2.1)*.3+vn(x*4.3,z*4.3)*.15;
const CX=z=>Math.sin(z*.011)*34+Math.sin(z*.027+1)*11,DCX=z=>Math.cos(z*.011)*.374+Math.cos(z*.027+1)*.297;

const OFF=z=>(Math.sin(z*.013)*.5+.5)*10+(Math.sin(z*.031+2)*.5+.5)*5,CF=z=>sm(.5,.8,Math.sin(z*.0047+1.3)*.5+.5);

/* renderer */
const ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(ren.domElement);

const hemi=new THREE.HemisphereLight(0xffffff,0x56624a,.7),sunL=new THREE.DirectionalLight(0xffffff,1),lamp=new THREE.PointLight(0xffe6b0,0,26);

const skyM=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,uniforms:{t:{value:C(0)},h:{value:C(0)},sc:{value:C(0)},sd:{value:V(0,1,0)},k:{value:1},w:{value:0}},

const disc=new THREE.Mesh(new THREE.SphereGeometry(26,16,12),new THREE.MeshBasicMaterial({fog:false,transparent:true}));scn.add(disc);

/* weather */
const W={
sun:{l:'☀️ Sunny',top:C(0x6aa7e0),hor:C(0xf2e9d2),sc:C(0xfff0c8),oc:C(0x1a86bd),sh:C(0x4fe3d6),cl:C(0xffffff),sd:V(.55,.5,-.7),fog:.0025,amb:.7,sun:1,rain:0,A:.3,nt:0,co:.9},

fog:{l:'🌫️ Fog',top:C(0xbfc0c0),hor:C(0xd9d3c9),sc:C(0xffffff),oc:C(0x6a98ac),sh:C(0xa5cbcb),cl:C(0xc8d0d4),sd:V(.3,.6,-.7),fog:.014,amb:.85,sun:.2,rain:0,A:.25,nt:.1,co:.5},
sunset:{l:'🌅 Sunset',top:C(0x4a3a7e),hor:C(0xffa56e),sc:C(0xffa357),oc:C(0x2a5f9a),sh:C(0x7ad0c4),cl:C(0xffc3a0),sd:V(.6,.028,-.8),fog:.0028,amb:1.0,sun:.9,rain:0,A:.35,nt:.35,co:.85},

function setW(k){wk=k;sv('wx',k);[...$('wx').children].forEach(b=>b.dataset.k&&b.classList.toggle('on',b.dataset.k===k))}
for(const k in W){const b=document.createElement('button');b.textContent=W[k].l;b.dataset.k=k;b.onclick=()=>setW(k);$('wx').appendChild(b)}
let AW=ld('aw')==='1',wt=40;const aw=document.createElement('button');aw.textContent='🎲 Auto';aw.title='Random weather';aw.classList.toggle('on',AW);aw.onclick=()=>{AW=!AW;sv('aw',AW?1:0);aw.classList.toggle('on',AW)};$('wx').appendChild(aw);

/* terrain */
const NX=100,NZ=108,CS=5,ZO=84,XO=60,GR=C(0x808085),GV=C(0x756e60),WH=C(0xf4f8fa),DG=C(0x7f9a4a);
const tg=new THREE.PlaneGeometry(1,1,NX,NZ);tg.rotateX(-Math.PI/2);tg.setAttribute('color',new THREE.BufferAttribute(new Float32Array((NX+1)*(NZ+1)*3),3));
const terr=new THREE.Mesh(tg,M(0xffffff,{vertexColors:true}));terr.frustumCulled=false;scn.add(terr);
function tint(x,z,h,u,c){const n=vn(x*.07,z*.07);
 if(u>0){const ee=6+OFF(z),cf=CF(z);if(h<-1.5)c.setRGB(.5,.66,.6).multiplyScalar(Math.max(.3,1+(h+1.5)*.14));else if(h<-.3)c.setRGB(.6-.04*n,.52-.04*n,.42);else{c.setRGB(.9-.06*n,.82-.06*n,.62);if(h>.4&&u>7)c.lerp(DG,Math.min(1,.5+n*.7))}if(cf>.35&&u>ee-1&&h>-1.7)c.lerp(GR,sm(.35,.7,cf)*.9)}
 else{const t=sm(10,50,-u);c.setRGB(.3+.1*n-.08*t,.52+.1*n-.12*t,.26);if(h>13)c.lerp(GR,sm(13,19,h))}
 if(u>0&&h<-1.1&&h>-1.9&&hs(x*3.1,z*3.7)>.3)c.lerp(WH,.75);else if(u<-8&&hs(x*5.3,z*4.1)>.95)c.setRGB(.95,.85,.35);
 if(Math.abs(u)<6.5)c.lerp(GV,.7)}
let tgx=1e9,tgz=1e9;
function upTerrain(px,pz){const gx=Math.round(px/10)*10,gz=Math.round(pz/10)*10;if(gx===tgx&&gz===tgz)return;tgx=gx;tgz=gz;
 const p=tg.attributes.position,c=tg.attributes.color,col=C(0);let n=0;
 for(let j=0;j<=NZ;j++)for(let i=0;i<=NX;i++,n++){const x=gx+(i-XO)*CS,z=gz+(j-ZO)*CS,h=H(x,z);p.setXYZ(n,x,h,z);tint(x,z,h,x-CX(z),col);c.setXYZ(n,col.r,col.g,col.b)}

/* ocean */
const OG='float hgt(vec2 p){float t=uT;return (sin(p.x*.105+t*1.1+sin(p.y*.02)*1.5)*.5+sin(dot(p,vec2(.17,.09))+t*1.5)*.3+sin(dot(p,vec2(.38,.17))+t*2.2)*.15+sin(dot(p,vec2(-.21,.33))+t*1.9)*.12)*(1.+.45*sin(p.y*.006+t*.15)*sin(p.x*.004-t*.1));}float OFFf(float z){return (sin(z*.013)*.5+.5)*10.+(sin(z*.031+2.)*.5+.5)*5.;}float CFf(float z){return smoothstep(.5,.8,sin(z*.0047+1.3)*.5+.5);}';
const TQ=C(0x7fe0d0),og=new THREE.PlaneGeometry(700,700,140,140).rotateX(-Math.PI/2);
const om=new THREE.ShaderMaterial({transparent:true,fog:true,
uniforms:THREE.UniformsUtils.merge([THREE.UniformsLib.fog,{uT:{value:0},uA:{value:.3},uSh:{value:C(0x4ab0c8)},uDp:{value:C(0x145070)},uSky:{value:C(0xcfe6f3)},uTop:{value:C(0x3f8fdc)},uSun:{value:V(0,1,0)},uSC:{value:C(0xffffff)},uL:{value:1}}]),
vertexShader:`uniform float uT,uA;varying vec3 vW;
${OG}
#include <fog_pars_vertex>
void main(){vec4 wp=modelMatrix*vec4(position,1.);float cz=wp.z;float u=wp.x-(sin(cz*.011)*34.+sin(cz*.027+1.)*11.);float e0=6.+OFFf(cz),w0=28.-22.*CFf(cz);float t=smoothstep(e0,e0+w0,u);float th=(.8+sin(cz*.006)*1.6+sin(cz*.017)*.6-.12)*(1.-t)-9.*t;float d=-1.8-th;wp.y+=hgt(wp.xz)*uA*smoothstep(0.,2.5,d)*(1.+.5*smoothstep(25.,120.,u));vW=wp.xyz;vec4 mvPosition=viewMatrix*wp;gl_Position=projectionMatrix*mvPosition;
#include <fog_vertex>
}`,
fragmentShader:`uniform float uT,uA,uL;uniform vec3 uSh,uDp,uSky,uTop,uSun,uSC;varying vec3 vW;
${OG}
#include <fog_pars_fragment>
void main(){vec2 p=vW.xz;float e=.5,h0=hgt(p);
vec3 n=normalize(vec3(-(hgt(p+vec2(e,0.))-h0)/e*uA,1.,-(hgt(p+vec2(0.,e))-h0)/e*uA));
n.xz+=vec2(sin(p.x*1.3+uT*2.)+sin(p.y*1.9-uT*1.6),sin(p.y*1.1+uT*1.9)+sin(p.x*2.1+uT*1.4))*.05*(1.-smoothstep(30.,130.,length(cameraPosition-vW)));n.xz+=vec2(sin(p.x*.35+p.y*.2+uT*.8),cos(p.y*.3-p.x*.15+uT*.7))*.04*(1.-smoothstep(50.,200.,length(cameraPosition-vW)));n=normalize(n);
vec3 V=normalize(cameraPosition-vW);vec3 R=reflect(-V,n);R.y=abs(R.y);
float F=.02+.98*pow(1.-max(dot(n,V),0.),5.);
vec3 sk=mix(uSky*.8,uTop*1.1,smoothstep(0.,.16,R.y));
float cz=p.y;float u=p.x-(sin(cz*.011)*34.+sin(cz*.027+1.)*11.);float e0=6.+OFFf(cz),w0=28.-22.*CFf(cz);float t=smoothstep(e0,e0+w0,u);

float dd=max(smoothstep(.2,6.5,d),smoothstep(25.,150.,u));vec3 body=mix(uSh*1.25,uDp,pow(dd,.8))*uL*1.3;
float pt=sin(p.x*.02+sin(p.y*.015)*2.)*sin(p.y*.025+1.)*.5+.5;body=mix(body,uDp*.7*uL,pt*.3*smoothstep(10.,70.,u)+smoothstep(60.,170.,u)*.25);
vec2 q=p*.7+vec2(uT*.3,-uT*.2);float cs=pow(1.-abs(sin(q.x*3.+sin(q.y*2.))*sin(q.y*3.+sin(q.x*2.))),6.);
body+=uSh*cs*.55*(1.-smoothstep(.3,2.8,d))*step(0.,d)*uL*(1.-smoothstep(25.,75.,length(cameraPosition-vW)));float lit=clamp(.5+(dot(n,normalize(uSun+vec3(0.,.5,0.)))-.4)*5.,0.,1.5);body*=.55+.55*lit;body+=uSh*smoothstep(-.2,1.1,h0)*.5*uL;
vec3 n2=normalize(n+vec3(sin(p.x*3.1+uT*3.)+sin(p.y*2.7-uT*2.3),0.,sin(p.y*3.3+uT*2.7)+sin(p.x*2.9-uT*2.1))*.045*(1.-smoothstep(20.,110.,length(cameraPosition-vW))));vec3 R2=reflect(-V,n2);R2.y=abs(R2.y);float sp=pow(max(dot(R2,uSun),0.),420.)*3.5+pow(max(dot(R,uSun),0.),60.)*.25;
float fl=1.-smoothstep(0.,.6,d+sin(uT*.7+p.y*.06)*.18);float n1=sin(p.x*2.3+p.y*1.7+uT)*sin(p.y*2.9-p.x*1.3-uT*.7)*.5+.5;
float cr=smoothstep(.9,1.4,h0)*smoothstep(.5,1.3,uA)*(.5+.5*n1)*(1.-smoothstep(40.,150.,length(cameraPosition-vW)));
float bl=(1.-smoothstep(0.,.3,abs(sin((d*1.3-uT*.4)*3.14159))))*(1.-smoothstep(.3,3.5,d))*smoothstep(.2,.8,n1)*step(.05,d);float foam=clamp(fl*(.55+.45*n1)+cr*.7+bl*.8,0.,1.);
vec3 col=mix(body,sk*uL,F*.24)+uSC*sp;col=mix(col,vec3(.95,.97,1.)*uL,foam);
float al=mix(.22,.96,smoothstep(0.,3.4,d));al=max(al,foam);al*=1.-smoothstep(310.,345.,max(abs(vW.x-cameraPosition.x),abs(vW.z-cameraPosition.z)));

#ifdef USE_FOG
float ff=1.-exp(-fogDensity*fogDensity*fogDepth*fogDepth*.22);ff=max(ff,smoothstep(200.,340.,fogDepth));gl_FragColor.rgb=mix(gl_FragColor.rgb,mix(fogColor,uTop,.3),ff);

}`}),ocean=new THREE.Mesh(og,om);ocean.frustumCulled=false;scn.add(ocean);
function upOcean(px,pz,t){const ox=Math.round(px/5)*5,oz=Math.round(pz/5)*5,U=om.uniforms;ocean.position.set(ox,-1.8,oz);
 U.uT.value=t;U.uA.value=cur.A*2.2*(1+cur.rain*.3);U.uSh.value.copy(cur.sh);U.uDp.value.copy(cur.oc).multiplyScalar(.7);U.uSky.value.copy(cur.hor);U.uTop.value.copy(cur.top);U.uSun.value.copy(cur.sd).normalize();U.uSC.value.copy(cur.sc).multiplyScalar(Math.min(1,cur.sun*1.2));U.uL.value=Math.max(.25,Math.min(1,cur.amb*.9+cur.sun*.25))}
 

/* road */
const RR=240,rpos=new Float32Array(RR*6),rgm=new THREE.BufferGeometry();rgm.setAttribute('position',new THREE.BufferAttribute(rpos,3));
{const ix=[];for(let i=0;i<RR-1;i++){const a=i*2;ix.push(a,a+1,a+2,a+1,a+3,a+2)}rgm.setIndex(ix)}
rgm.setAttribute('normal',new THREE.BufferAttribute(new Float32Array(RR*6).map((v,i)=>i%3==1?1:0),3));const road=new THREE.Mesh(rgm,M(0x5a5e68));road.frustumCulled=false;scn.add(road);
const epos=new Float32Array(RR*12),egm=new THREE.BufferGeometry();egm.setAttribute('position',new THREE.BufferAttribute(epos,3));
